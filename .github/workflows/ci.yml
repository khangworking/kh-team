name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Build once per OS, then install the packed tarball like a new user and start HQ.
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Session backends (fake agent)
        run: npx tsx scripts/session-backend-test.ts
      - name: Agent clones (line endings)
        run: npx tsx scripts/workspace-test.ts
      - name: Reminders for unfinished tasks
        run: npx tsx scripts/nudge-test.ts
      - name: Daily budget
        run: npx tsx scripts/budget-test.ts
      - name: Subscription usage limits
        run: npx tsx scripts/ratelimit-test.ts
      - name: Agent out of credit
        run: npx tsx scripts/credit-test.ts
      - name: Inbox on disk
        run: npx tsx scripts/inbox-test.ts
      - name: Continue the last conversation
        run: npx tsx scripts/resume-test.ts
      - name: Cross-review
        run: npx tsx scripts/cross-review-test.ts
      - name: Branches deleted on GitHub
        run: npx tsx scripts/branch-cleanup-test.ts
      - name: Model lists and provider keys
        run: npx tsx scripts/models-test.ts
      - name: CLI versions
        run: npx tsx scripts/cli-versions-test.ts
      - name: Rename (old JSM HQ files keep working)
        run: npx tsx scripts/rename-test.ts
      - name: Pack
        shell: bash
        run: mkdir -p pack && npm pack --ignore-scripts --pack-destination pack
      - name: CLI smoke test
        run: node bin/kh-team.mjs --version && node bin/kh-team.mjs --help
      - name: Install and run like a new user
        shell: bash
        run: node scripts/smoke-test.mjs pack/*.tgz 7431
      - if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: pack/*.tgz

  # A bare Linux with no compilers (no python, make or g++): proves nothing is
  # built from source on install, like a fresh Ubuntu or WSL machine.
  linux-bare:
    needs: build
    runs-on: ubuntu-latest
    container: node:22-bookworm-slim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: pack
      - run: apt-get update -qq && apt-get install -y -qq git >/dev/null
      - run: "! command -v make && ! command -v g++ && ! command -v python3"
      - run: node scripts/smoke-test.mjs pack/*.tgz 7431
